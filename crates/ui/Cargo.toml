[package]
name = "rafiflow-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["Window","Storage","Location","HtmlInputElement","HtmlTextAreaElement","HtmlSelectElement"] }
