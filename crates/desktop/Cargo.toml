[package]
name = "rafiflow"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rafiflow-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
fs2 = "0.4"
serde_json = "1"
gtk = "0.18"
